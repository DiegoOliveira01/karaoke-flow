server:
  address: 0.0.0.0
  port: 8080
  error:
    include-message: always   # mensagens de erro amigáveis chegam ao navegador

spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

karaoke:
  storage-dir: ./data/songs
  separator:
    url: http://127.0.0.1:8001
    read-timeout: 90m   # separar uma música pode demorar bastante sem GPU
  itunes:
    country: BR         # loja usada na busca de capas
